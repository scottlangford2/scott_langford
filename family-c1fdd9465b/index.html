const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function unlock(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const raw=await crypto.subtle.deriveBits({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,256);
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  sessionStorage.setItem("fhk",b(raw));
  return new TextDecoder().decode(pt);
}
async function show(pw){const h=await unlock(pw);document.open();document.write(h);document.close();}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const e=document.getElementById("e");e.textContent="Opening…";
  try{await show(document.getElementById("p").value);}catch(_){e.textContent="That password didn't work.";}
});

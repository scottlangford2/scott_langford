      desc: "Every registered tax-exempt organization, with address, NTEE code, and most recent revenue and assets."
    - name: "IRS Form 990 Series Downloads"
      topics: [nonprofits]
      units: [orgs]
      easy: false
      url: "https://www.irs.gov/charities-non-profits/form-990-series-downloads"
      desc: "Electronically filed Form 990 returns: detailed financials, compensation, and governance."
    - name: "National Center for Charitable Statistics"
      topics: [nonprofits]
      units: [orgs]
      easy: false
      url: "https://nccs.urban.org"
      desc: "Urban Institute's cleaned nonprofit panels built from IRS data."
    - name: "ProPublica Nonprofit Explorer"
      topics: [nonprofits]
      units: [orgs]
      easy: true
      url: "https://projects.propublica.org/nonprofits/"
      desc: "Searchable Form 990 data and filings for individual organizations. Good for case studies."


# Curated public data sources for students. Rendered by _pages/data-sources.html.
# Free sources only. Each entry: name, url, desc (what it is + unit/level),
# optional note (registration, quirks). Links checked 2026-11-12. bls.gov,
# fema.gov, cdc.gov and taxpolicycenter.org return 403 to curl but load in a browser.
- group: "Start Here: Portals and Archives"
  sources:
    - name: "data.census.gov"
      url: "https://data.census.gov"
      desc: "The Census Bureau's main search tool: American Community Survey, decennial census, and economic surveys, down to the tract level."
    - name: "IPUMS"
      url: "https://www.ipums.org"
      desc: "Harmonized census and survey microdata (IPUMS USA, CPS) plus historical tables and boundary files (NHGIS)."
      note: "Free registration."
    - name: "FRED"
      url: "https://fred.stlouisfed.org"
      desc: "Federal Reserve Bank of St. Louis time series: national, state, and many county and metro indicators, with easy downloads."
    - name: "ICPSR"
      url: "https://www.icpsr.umich.edu"
      desc: "Archive of social science datasets with codebooks. Texas State has institutional access."
    - name: "Harvard Dataverse"
      url: "https://dataverse.harvard.edu"
      desc: "Replication data and original datasets deposited by researchers."
    - name: "Data.gov"
      url: "https://data.gov"
      desc: "Catalog of federal agency datasets."
    - name: "Texas Open Data Portal"
      url: "https://data.texas.gov"
      desc: "State agency datasets for Texas."

- group: "State and Local Public Finance"
  sources:
    - name: "Census of Governments and Annual Survey of State and Local Government Finances"
      url: "https://www.census.gov/programs-surveys/gov-finances.html"
      desc: "Revenue, spending, debt, and assets for states, counties, cities, school districts, and special districts."
    - name: "Government Finance Database"
      url: "https://my.willamette.edu/site/mba/public-datasets"
      desc: "The Census government finance files cleaned into a consistent local-government panel back to 1967 (Pierson, Hand, and Thompson)."
    - name: "Fiscally Standardized Cities"
      url: "https://www.lincolninst.edu/data/fiscally-standardized-cities/"
      desc: "Lincoln Institute data that makes city finances comparable by adding in overlapping county, school, and special-district spending."
    - name: "Urban-Brookings Tax Policy Center State and Local Finance Data"
      url: "https://state-local-finance-data.taxpolicycenter.org"
      desc: "Query tool for Census finance data by state and level of government."
    - name: "EMMA (Municipal Securities Rulemaking Board)"
      url: "https://emma.msrb.org"
      desc: "Official statements, annual financial reports, and trade prices for municipal bonds."
    - name: "Federal Audit Clearinghouse"
      url: "https://www.fac.gov"
      desc: "Single Audit filings for governments and nonprofits that spend $750,000+ in federal awards: findings, opinions, and federal programs."
    - name: "USAspending.gov"
      url: "https://www.usaspending.gov"
      desc: "Federal contracts, grants, and loans by recipient and place."
    - name: "Texas Comptroller Transparency"
      url: "https://comptroller.texas.gov/transparency/"
      desc: "Texas local government debt, sales tax allocations, property tax data, and state spending."

- group: "Nonprofits"
  sources:
    - name: "IRS Exempt Organizations Business Master File"
      url: "https://www.irs.gov/charities-non-profits/exempt-organizations-business-master-file-extract-eo-bmf"
      desc: "Every registered tax-exempt organization, with address, NTEE code, and most recent revenue and assets."
    - name: "IRS Form 990 Series Downloads"
      url: "https://www.irs.gov/charities-non-profits/form-990-series-downloads"
      desc: "Electronically filed Form 990 returns: detailed financials, compensation, and governance."
    - name: "National Center for Charitable Statistics"
      url: "https://nccs.urban.org"
      desc: "Urban Institute's cleaned nonprofit panels built from IRS data."
    - name: "ProPublica Nonprofit Explorer"
      url: "https://projects.propublica.org/nonprofits/"
      desc: "Searchable Form 990 data and filings for individual organizations. Good for case studies."

- group: "Economy, Employment, and Banking"
  sources:
    - name: "BLS Local Area Unemployment Statistics"
      url: "https://www.bls.gov/lau/"
      desc: "Monthly labor force and unemployment for states, counties, and metro areas."
    - name: "BLS Quarterly Census of Employment and Wages"
      url: "https://www.bls.gov/cew/"
      desc: "Establishments, employment, and wages by county and industry."
    - name: "County Business Patterns"
      url: "https://www.census.gov/programs-surveys/cbp.html"
      desc: "Annual establishment counts and payroll by county, ZIP code, and industry."
    - name: "LEHD (Quarterly Workforce Indicators and OnTheMap)"
      url: "https://lehd.ces.census.gov"
      desc: "Hiring, separations, and earnings by worker demographics; where people live versus where they work."
    - name: "BEA Regional Data"
      url: "https://apps.bea.gov/regional/"
      desc: "Personal income and GDP by state, county, and metro area."
    - name: "FDIC BankFind Suite"
      url: "https://banks.data.fdic.gov/bankfind-suite/"
      desc: "Bank branches, financials, and failures."
    - name: "HMDA Data"
      url: "https://ffiec.cfpb.gov"
      desc: "Mortgage applications and lending decisions, down to the census tract."
    - name: "Opportunity Insights"
      url: "https://opportunityinsights.org/data/"
      desc: "Economic mobility measures by county, commuting zone, and tract."

- group: "Disasters, Hazards, and the Environment"
  sources:
    - name: "OpenFEMA"
      url: "https://www.fema.gov/about/openfema/data-sets"
      desc: "Disaster declarations, Public Assistance, Hazard Mitigation, Individual Assistance, and flood insurance claims."
    - name: "NOAA Storm Events Database"
      url: "https://www.ncei.noaa.gov/access/storm-events-database/"
      desc: "Event-level records of storms and other severe weather with dates, locations, damages, and casualties."
    - name: "FEMA National Risk Index (in RAPT)"
      url: "https://www.fema.gov/emergency-managers/practitioners/resilience-analysis-and-planning-tool"
      desc: "Expected loss, social vulnerability, and community resilience scores for 18 natural hazards by county and tract."
      note: "The standalone National Risk Index site was retired in 2025; its data now sits in FEMA's Resilience Analysis and Planning Tool."

- group: "Health, Elections, and Local Governance"
  sources:
    - name: "CDC WONDER"
      url: "https://wonder.cdc.gov"
      desc: "Mortality and other public health data by county and cause."
    - name: "County Health Rankings"
      url: "https://www.countyhealthrankings.org"
      desc: "County-level health outcomes and the factors behind them, compiled from many sources."
    - name: "MIT Election Data and Science Lab"
      url: "https://electionlab.mit.edu/data"
      desc: "Election returns by state, county, and precinct."
    - name: "LocalView"
      url: "https://doi.org/10.7910/DVN/NJTBEM"
      desc: "Transcripts of thousands of local government meetings posted to YouTube."

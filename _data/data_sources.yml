# Curated public data sources for students. Rendered by _pages/data-sources.html.
# Free sources only. Each entry: name, url, desc (what it is + unit/level),
# optional note (registration, quirks).
# Finder tags (used by assets/js/data-finder.js): topics = finance nonprofits
# economy disasters environment health politics sports arts cities general;
# units = people orgs places countries events; easy = has a point-and-click
# web tool, so a beginner can explore it without downloading files.
# Links checked 2026-11-12. bls.gov, fema.gov, cdc.gov and taxpolicycenter.org
# return 403 to curl but load in a browser.
- group: "Start Here: Portals and Archives"
  sources:
    - name: "data.census.gov"
      topics: [general, economy, cities]
      units: [places]
      easy: true
      url: "https://data.census.gov"
      desc: "The Census Bureau's main search tool: American Community Survey, decennial census, and economic surveys, down to the tract level."
    - name: "IPUMS"
      topics: [general, economy]
      units: [people, places]
      easy: false
      url: "https://www.ipums.org"
      desc: "Harmonized census and survey microdata (IPUMS USA, CPS) plus historical tables and boundary files (NHGIS)."
      note: "Free registration."
    - name: "FRED"
      topics: [general, economy]
      units: [places, countries]
      easy: true
      url: "https://fred.stlouisfed.org"
      desc: "Federal Reserve Bank of St. Louis time series: national, state, and many county and metro indicators, with easy downloads."
    - name: "ICPSR"
      topics: [general, politics, health, arts]
      units: [people]
      easy: false
      url: "https://www.icpsr.umich.edu"
      desc: "Archive of social science datasets with codebooks. Texas State has institutional access."
    - name: "Harvard Dataverse"
      topics: [general]
      units: [people, orgs, places]
      easy: false
      url: "https://dataverse.harvard.edu"
      desc: "Replication data and original datasets deposited by researchers."
    - name: "Data.gov"
      topics: [general, environment]
      units: [places, orgs]
      easy: false
      url: "https://data.gov"
      desc: "Catalog of federal agency datasets."
    - name: "Texas Open Data Portal"
      topics: [general, cities]
      units: [places, orgs]
      easy: true
      url: "https://data.texas.gov"
      desc: "State agency datasets for Texas."

- group: "State and Local Public Finance"
  sources:
    - name: "Census of Governments and Annual Survey of State and Local Government Finances"
      topics: [finance]
      units: [places]
      easy: false
      url: "https://www.census.gov/programs-surveys/gov-finances.html"
      desc: "Revenue, spending, debt, and assets for states, counties, cities, school districts, and special districts."
    - name: "Government Finance Database"
      topics: [finance]
      units: [places]
      easy: false
      url: "https://my.willamette.edu/site/mba/public-datasets"
      desc: "The Census government finance files cleaned into a consistent local-government panel back to 1967 (Pierson, Hand, and Thompson)."
    - name: "Fiscally Standardized Cities"
      topics: [finance, cities]
      units: [places]
      easy: true
      url: "https://www.lincolninst.edu/data/fiscally-standardized-cities/"
      desc: "Lincoln Institute data that makes city finances comparable by adding in overlapping county, school, and special-district spending."
    - name: "Urban-Brookings Tax Policy Center State and Local Finance Data"
      topics: [finance]
      units: [places]
      easy: true
      url: "https://state-local-finance-data.taxpolicycenter.org"
      desc: "Query tool for Census finance data by state and level of government."
    - name: "EMMA (Municipal Securities Rulemaking Board)"
      topics: [finance]
      units: [orgs]
      easy: true
      url: "https://emma.msrb.org"
      desc: "Official statements, annual financial reports, and trade prices for municipal bonds."
    - name: "Federal Audit Clearinghouse"
      topics: [finance, nonprofits]
      units: [orgs]
      easy: false
      url: "https://www.fac.gov"
      desc: "Single Audit filings for governments and nonprofits that spend $750,000+ in federal awards: findings, opinions, and federal programs."
    - name: "USAspending.gov"
      topics: [finance]
      units: [orgs, places]
      easy: true
      url: "https://www.usaspending.gov"
      desc: "Federal contracts, grants, and loans by recipient and place."
    - name: "Texas Comptroller Transparency"
      topics: [finance, cities]
      units: [places]
      easy: true
      url: "https://comptroller.texas.gov/transparency/"
      desc: "Texas local government debt, sales tax allocations, property tax data, and state spending."

- group: "Nonprofits"
  sources:

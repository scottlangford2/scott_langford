<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Four target diagrams contrasting reliability and validity: low reliability with scattered shots, high reliability with tight clusters, and validity shown by whether the shots centre on the bullseye.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .colh { font: 600 13px "Helvetica Neue", Arial, sans-serif; fill: #3a3a3a; }
    .rowh { font: 600 13px "Helvetica Neue", Arial, sans-serif; fill: #501214; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
    .ring { fill: none; stroke: #d8d8d8; stroke-width: 1.3; }
    .shot { fill: #501214; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">MEASUREMENT &#183; CH 4</text>
  <text x="24" y="72" class="head">Validity and reliability are not the same</text>
  <text x="24" y="94" class="dek">Reliability is consistency (a tight cluster); validity is hitting what you mean to measure (the centre)</text>

  <!-- column headers -->
  <text x="300" y="140" text-anchor="middle" class="colh">Low reliability</text>
  <text x="520" y="140" text-anchor="middle" class="colh">High reliability</text>
  <!-- row labels -->
  <text x="150" y="205" text-anchor="end" class="rowh">Low validity</text>
  <text x="150" y="335" text-anchor="end" class="rowh">High validity</text>

  <!-- TL: low reliability, low validity (scatter, off-centre) -->
  <g transform="translate(300,200)">
    <circle r="52" class="ring"/><circle r="34" class="ring"/><circle r="17" class="ring"/>
    <g class="shot"><circle cx="-30" cy="-24" r="4"/><circle cx="-8" cy="-38" r="4"/><circle cx="-40" cy="2" r="4"/><circle cx="-14" cy="-8" r="4"/><circle cx="-46" cy="-14" r="4"/></g>
  </g>
  <!-- TR: high reliability, low validity (tight, off-centre) -->
  <g transform="translate(520,200)">
    <circle r="52" class="ring"/><circle r="34" class="ring"/><circle r="17" class="ring"/>
    <g class="shot"><circle cx="-26" cy="-24" r="4"/><circle cx="-32" cy="-18" r="4"/><circle cx="-22" cy="-16" r="4"/><circle cx="-28" cy="-28" r="4"/></g>
  </g>
  <!-- BL: low reliability, high validity (scatter, centred on average) -->
  <g transform="translate(300,330)">
    <circle r="52" class="ring"/><circle r="34" class="ring"/><circle r="17" class="ring"/>
    <g class="shot"><circle cx="2" cy="-30" r="4"/><circle cx="-28" cy="6" r="4"/><circle cx="26" cy="12" r="4"/><circle cx="-6" cy="-2" r="4"/><circle cx="10" cy="-18" r="4"/></g>
  </g>
  <!-- BR: high reliability, high validity (tight, centred) -->
  <g transform="translate(520,330)">
    <circle r="52" class="ring"/><circle r="34" class="ring"/><circle r="17" class="ring"/>
    <g class="shot"><circle cx="0" cy="0" r="4"/><circle cx="7" cy="-5" r="4"/><circle cx="-6" cy="5" r="4"/><circle cx="4" cy="7" r="4"/></g>
  </g>

  <text x="24" y="414" class="src">A measure can be reliable yet invalid (top right): precisely, consistently wrong.</text>
</svg>

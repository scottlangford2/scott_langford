<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-label="Two schematic panels. Left: interrupted time series, an outcome rising over time with an upward level jump at the intervention. Right: regression discontinuity, a jump in the outcome at a cutoff value of the running variable.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .pt   { font: 600 13px "Helvetica Neue", Arial, sans-serif; fill: #3a3a3a; }
    .lab  { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; fill: #501214; }
    .ax   { font: 400 11.5px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">SHARP DESIGNS &#183; CH 9</text>
  <text x="24" y="72" class="head">Two ways to exploit a sharp change</text>
  <text x="24" y="94" class="dek">A break in time (interrupted time series) or a jump at a threshold (regression discontinuity)</text>

  <!-- PANEL A: ITS -->
  <text x="60" y="132" class="pt">Interrupted time series</text>
  <line x1="60" y1="150" x2="60" y2="300" stroke="#c9c9c9" stroke-width="1"/>
  <line x1="60" y1="300" x2="330" y2="300" stroke="#c9c9c9" stroke-width="1"/>
  <!-- intervention line -->
  <line x1="200" y1="150" x2="200" y2="300" stroke="#501214" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="204" y="164" class="lab">intervention</text>
  <!-- pre trend points -->
  <g fill="#8a8a8a"><circle cx="78" cy="278" r="3.5"/><circle cx="108" cy="270" r="3.5"/><circle cx="138" cy="264" r="3.5"/><circle cx="168" cy="256" r="3.5"/><circle cx="196" cy="250" r="3.5"/></g>
  <line x1="74" y1="281" x2="200" y2="248" stroke="#9a9a9a" stroke-width="1.6"/>
  <!-- post trend points (jumped up) -->
  <g fill="#501214"><circle cx="204" cy="216" r="3.5"/><circle cx="234" cy="208" r="3.5"/><circle cx="264" cy="200" r="3.5"/><circle cx="294" cy="192" r="3.5"/><circle cx="322" cy="186" r="3.5"/></g>
  <line x1="204" y1="216" x2="324" y2="185" stroke="#501214" stroke-width="1.8"/>
  <text x="336" y="200" class="lab">level jump</text>
  <text x="195" y="318" text-anchor="middle" class="ax">time &#8594;</text>

  <!-- PANEL B: RD -->
  <text x="410" y="132" class="pt">Regression discontinuity</text>
  <line x1="410" y1="150" x2="410" y2="300" stroke="#c9c9c9" stroke-width="1"/>
  <line x1="410" y1="300" x2="690" y2="300" stroke="#c9c9c9" stroke-width="1"/>
  <!-- cutoff line -->
  <line x1="550" y1="150" x2="550" y2="300" stroke="#501214" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="550" y="164" text-anchor="middle" class="lab">cutoff</text>
  <!-- below cutoff (control) -->
  <g fill="#8a8a8a"><circle cx="424" cy="270" r="3.5"/><circle cx="454" cy="264" r="3.5"/><circle cx="484" cy="258" r="3.5"/><circle cx="514" cy="252" r="3.5"/><circle cx="544" cy="246" r="3.5"/></g>
  <line x1="422" y1="271" x2="548" y2="245" stroke="#9a9a9a" stroke-width="1.6"/>
  <!-- above cutoff (treated, jumped) -->
  <g fill="#501214"><circle cx="556" cy="212" r="3.5"/><circle cx="586" cy="206" r="3.5"/><circle cx="616" cy="200" r="3.5"/><circle cx="646" cy="194" r="3.5"/><circle cx="676" cy="188" r="3.5"/></g>
  <line x1="556" y1="212" x2="678" y2="187" stroke="#501214" stroke-width="1.8"/>
  <text x="600" y="234" class="lab">jump at cutoff</text>
  <text x="550" y="318" text-anchor="middle" class="ax">running variable &#8594;</text>

  <text x="24" y="340" class="src">Illustrative. Both approximate an experiment locally, given a sharp, non-manipulated rule.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Difference-in-differences line chart of full-time-equivalent fast-food employment: New Jersey rose from 20.44 to 21.03 while Pennsylvania fell from 23.33 to 21.17. The New Jersey counterfactual falls to 18.28, so the difference-in-differences is +2.76.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .val  { font: 700 12.5px "Helvetica Neue", Arial, sans-serif; }
    .ax   { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .axb  { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; fill: #4b4b4b; }
    .leg  { font: 600 12px "Helvetica Neue", Arial, sans-serif; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">DIFFERENCE-IN-DIFFERENCES &#183; CARD &amp; KRUEGER (1994)</text>
  <text x="24" y="72" class="head">Employment did not fall in New Jersey</text>
  <text x="24" y="94" class="dek">Full-time-equivalent employment per restaurant, before and after New Jersey's 1992 minimum-wage rise</text>

  <!-- gridlines + right axis -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="180" y1="130" x2="560" y2="130"/>
    <line x1="180" y1="207" x2="560" y2="207"/>
    <line x1="180" y1="283" x2="560" y2="283"/>
    <line x1="180" y1="360" x2="560" y2="360"/>
  </g>
  <text x="572" y="134" class="ax">24</text>
  <text x="572" y="211" class="ax">22</text>
  <text x="572" y="287" class="ax">20</text>
  <text x="572" y="364" class="ax">18</text>

  <!-- PA control (gray) 23.33 -> 21.17 -->
  <polyline points="180,156 520,238.5" fill="none" stroke="#BEBEBE" stroke-width="2.5"/>
  <circle cx="180" cy="156" r="4.5" fill="#9a9a9a"/><circle cx="520" cy="238.5" r="4.5" fill="#9a9a9a"/>
  <text x="180" y="147" text-anchor="middle" class="val" fill="#6b6b6b">23.33</text>
  <text x="528" y="228" class="val" fill="#6b6b6b">21.17</text>

  <!-- NJ counterfactual (dashed maroon) 20.44 -> 18.28 -->
  <polyline points="180,266.5 520,349" fill="none" stroke="#501214" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="520" cy="349" r="4" fill="none" stroke="#501214" stroke-width="1.6"/>
  <text x="508" y="353" text-anchor="end" class="val" fill="#3d0e10">counterfactual 18.28</text>

  <!-- NJ treated (maroon) 20.44 -> 21.03 -->
  <polyline points="180,266.5 520,244" fill="none" stroke="#501214" stroke-width="2.8"/>
  <circle cx="180" cy="266.5" r="4.5" fill="#501214"/><circle cx="520" cy="244" r="4.5" fill="#501214"/>
  <text x="180" y="285" text-anchor="middle" class="val" fill="#501214">20.44</text>
  <text x="528" y="241" class="val" fill="#501214">21.03</text>

  <!-- DiD bracket at 'after' between counterfactual(349) and NJ_after(244) -->
  <path d="M545,244 L553,244 L553,349 L545,349" fill="none" stroke="#501214" stroke-width="1.4"/>
  <text x="560" y="300" class="val" fill="#501214">DiD = +2.76</text>

  <!-- x labels -->
  <text x="180" y="392" text-anchor="middle" class="axb">Before (Feb 1992)</text>
  <text x="520" y="392" text-anchor="middle" class="axb">After (Nov 1992)</text>

  <!-- legend -->
  <rect x="24" y="118" width="14" height="4" fill="#501214"/><text x="44" y="123" class="leg" fill="#501214">New Jersey (treated)</text>
  <rect x="24" y="136" width="14" height="4" fill="#BEBEBE"/><text x="44" y="141" class="leg" fill="#6b6b6b">Pennsylvania (comparison)</text>

  <text x="24" y="418" class="src">Source: Card &amp; Krueger (1994). FTE = full-time-equivalent.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Grouped bar chart of Perry Preschool outcomes, program versus no-program group: high-school graduation 65 versus 45 percent, earned $20,000-plus 60 versus 40 percent, arrested five or more times 36 versus 55 percent.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .val  { font: 700 12.5px "Helvetica Neue", Arial, sans-serif; }
    .glab { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; fill: #3a3a3a; }
    .ax   { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .leg  { font: 600 12px "Helvetica Neue", Arial, sans-serif; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">SMALL-N EVIDENCE &#183; CASE E</text>
  <text x="24" y="72" class="head">Perry Preschool: two groups, decades later</text>
  <text x="24" y="94" class="dek">Share of each group reaching the outcome (%), at age 40</text>

  <!-- legend -->
  <rect x="360" y="34" width="13" height="13" fill="#501214"/><text x="379" y="45" class="leg" fill="#501214">Program (n=58)</text>
  <rect x="520" y="34" width="13" height="13" fill="#BEBEBE"/><text x="539" y="45" class="leg" fill="#6b6b6b">No-program (n=65)</text>

  <!-- gridlines + right axis (%) -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="70" y1="130" x2="620" y2="130"/>
    <line x1="70" y1="185" x2="620" y2="185"/>
    <line x1="70" y1="240" x2="620" y2="240"/>
    <line x1="70" y1="295" x2="620" y2="295"/>
  </g>
  <line x1="70" y1="350" x2="620" y2="350" stroke="#c9c9c9" stroke-width="1"/>
  <text x="628" y="134" class="ax">100</text>
  <text x="628" y="189" class="ax">75</text>
  <text x="628" y="244" class="ax">50</text>
  <text x="628" y="299" class="ax">25</text>
  <text x="628" y="354" class="ax">0</text>

  <!-- group 1: HS grad 65 / 45  (h = %*2.2) -->
  <rect x="120" y="207" width="46" height="143" fill="#501214"/>
  <rect x="170" y="251" width="46" height="99" fill="#BEBEBE"/>
  <text x="143" y="199" text-anchor="middle" class="val" fill="#501214">65%</text>
  <text x="193" y="243" text-anchor="middle" class="val" fill="#6b6b6b">45%</text>
  <text x="168" y="370" text-anchor="middle" class="glab">Graduated</text>
  <text x="168" y="386" text-anchor="middle" class="glab">high school</text>

  <!-- group 2: earned $20k 60 / 40 -->
  <rect x="310" y="218" width="46" height="132" fill="#501214"/>
  <rect x="360" y="262" width="46" height="88" fill="#BEBEBE"/>
  <text x="333" y="210" text-anchor="middle" class="val" fill="#501214">60%</text>
  <text x="383" y="254" text-anchor="middle" class="val" fill="#6b6b6b">40%</text>
  <text x="358" y="370" text-anchor="middle" class="glab">Earned $20k+</text>
  <text x="358" y="386" text-anchor="middle" class="glab">at age 40</text>

  <!-- group 3: arrested 5+ 36 / 55 -->
  <rect x="500" y="271" width="46" height="79" fill="#501214"/>
  <rect x="550" y="229" width="46" height="121" fill="#BEBEBE"/>
  <text x="523" y="263" text-anchor="middle" class="val" fill="#501214">36%</text>
  <text x="573" y="221" text-anchor="middle" class="val" fill="#6b6b6b">55%</text>
  <text x="548" y="370" text-anchor="middle" class="glab">Arrested</text>
  <text x="548" y="386" text-anchor="middle" class="glab">5+ times</text>

  <text x="24" y="404" class="src">Source: Schweinhart et al. (2005). For arrests, lower is better.</text>
</svg>

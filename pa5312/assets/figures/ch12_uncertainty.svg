<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Two effect estimates with 95 percent confidence intervals on a horizontal scale. Effect A's interval lies entirely above zero and is distinguishable from zero. Effect B's interval crosses zero and is not.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .rlab { font: 700 13px "Helvetica Neue", Arial, sans-serif; fill: #3a3a3a; }
    .note { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; }
    .ax   { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">COMMUNICATING FINDINGS &#183; CH 12</text>
  <text x="24" y="72" class="head">Report the estimate with its uncertainty</text>
  <text x="24" y="94" class="dek">If the confidence interval crosses zero, the effect is not distinguishable from none</text>

  <!-- zero line -->
  <line x1="250" y1="140" x2="250" y2="300" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="250" y="320" text-anchor="middle" class="ax">0 &#183; no effect</text>
  <!-- baseline axis -->
  <line x1="150" y1="300" x2="660" y2="300" stroke="#c9c9c9" stroke-width="1"/>
  <text x="640" y="320" text-anchor="end" class="ax">larger effect &#8594;</text>

  <!-- Effect A: CI entirely above zero -->
  <text x="140" y="184" text-anchor="end" class="rlab">Effect A</text>
  <line x1="360" y1="180" x2="500" y2="180" stroke="#501214" stroke-width="2.4"/>
  <line x1="360" y1="172" x2="360" y2="188" stroke="#501214" stroke-width="2.4"/>
  <line x1="500" y1="172" x2="500" y2="188" stroke="#501214" stroke-width="2.4"/>
  <circle cx="430" cy="180" r="6" fill="#501214"/>
  <text x="516" y="184" class="note" fill="#501214">distinguishable from zero</text>

  <!-- Effect B: CI crosses zero -->
  <text x="140" y="244" text-anchor="end" class="rlab">Effect B</text>
  <line x1="180" y1="240" x2="420" y2="240" stroke="#9a9a9a" stroke-width="2.4"/>
  <line x1="180" y1="232" x2="180" y2="248" stroke="#9a9a9a" stroke-width="2.4"/>
  <line x1="420" y1="232" x2="420" y2="248" stroke="#9a9a9a" stroke-width="2.4"/>
  <circle cx="300" cy="240" r="6" fill="#6b6b6b"/>
  <text x="436" y="244" class="note" fill="#6b6b6b">not distinguishable from zero</text>

  <!-- key -->
  <circle cx="360" cy="128" r="5" fill="#501214"/><text x="372" y="132" class="ax">point estimate</text>
  <line x1="470" y1="128" x2="510" y2="128" stroke="#501214" stroke-width="2.4"/><text x="518" y="132" class="ax">95% confidence interval</text>

  <text x="24" y="336" class="src">A precise point estimate can still be uncertain &#8212; always show the interval.</text>
</svg>

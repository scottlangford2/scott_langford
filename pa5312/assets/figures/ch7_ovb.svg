<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Path diagram: the program X affects the outcome Y (the effect of interest). An omitted confounder Z affects both X and Y, opening a back-door path that biases the estimate if Z is left out.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .node { font: 700 15px "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
    .sub  { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #6b6b6b; }
    .elab { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">REGRESSION &#183; CH 7</text>
  <text x="24" y="72" class="head">Why &#8220;controlling for&#8221; is not enough</text>
  <text x="24" y="94" class="dek">An omitted confounder opens a back-door path that biases the estimated effect</text>

  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#501214"/></marker>
    <marker id="a7g" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a9a9a"/></marker>
  </defs>

  <!-- nodes -->
  <circle cx="180" cy="250" r="30" fill="#f7f1f0" stroke="#501214" stroke-width="1.5"/>
  <text x="180" y="255" text-anchor="middle" class="node">X</text>
  <text x="180" y="298" text-anchor="middle" class="sub">program</text>

  <circle cx="540" cy="250" r="30" fill="#f7f1f0" stroke="#501214" stroke-width="1.5"/>
  <text x="540" y="255" text-anchor="middle" class="node">Y</text>
  <text x="540" y="298" text-anchor="middle" class="sub">outcome</text>

  <circle cx="360" cy="150" r="30" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" class="node" fill="#4b4b4b">Z</text>
  <text x="360" y="128" text-anchor="middle" class="sub">omitted confounder</text>

  <!-- X -> Y effect of interest -->
  <line x1="211" y1="250" x2="507" y2="250" stroke="#501214" stroke-width="2.4" marker-end="url(#a7)"/>
  <text x="360" y="242" text-anchor="middle" class="elab" fill="#501214">effect of interest</text>

  <!-- Z -> X and Z -> Y (backdoor, gray dashed) -->
  <line x1="338" y1="176" x2="200" y2="226" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a7g)"/>
  <line x1="382" y1="176" x2="520" y2="226" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a7g)"/>
  <text x="360" y="196" text-anchor="middle" class="elab" fill="#7a7a7a">back-door path &#8212; bias if Z is left out</text>

  <text x="24" y="326" class="src">Controlling only for what you measured leaves any unmeasured Z in the estimate.</text>
</svg>

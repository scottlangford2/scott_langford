<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Histogram of Texas cities by 2024 per-capita economic-development sales-tax allocation, right-skewed. The mean of $395 sits to the right of the median of $276.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .ax   { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .axb  { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; fill: #4b4b4b; }
    .mk   { font: 600 12px "Helvetica Neue", Arial, sans-serif; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">DESCRIBING DATA &#183; CASE A</text>
  <text x="24" y="72" class="head">A right-skewed distribution</text>
  <text x="24" y="94" class="dek">Texas cities by 2024 per-capita economic-development sales-tax allocation</text>

  <!-- gridlines + right axis (count) -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="70" y1="120" x2="620" y2="120"/>
    <line x1="70" y1="197" x2="620" y2="197"/>
    <line x1="70" y1="273" x2="620" y2="273"/>
  </g>
  <line x1="70" y1="350" x2="620" y2="350" stroke="#c9c9c9" stroke-width="1"/>
  <text x="628" y="124" class="ax">300</text>
  <text x="628" y="201" class="ax">200</text>
  <text x="628" y="277" class="ax">100</text>
  <text x="628" y="354" class="ax">0</text>

  <!-- bars: 173,247,191,294,176,60  (heights *0.767) -->
  <g fill="#501214">
    <rect x="80"  y="217" width="78" height="133"/>
    <rect x="176" y="161" width="78" height="189"/>
    <rect x="272" y="204" width="78" height="146"/>
    <rect x="368" y="125" width="78" height="225"/>
    <rect x="464" y="215" width="78" height="135"/>
    <rect x="560" y="304" width="78" height="46"/>
  </g>

  <!-- median + mean markers -->
  <line x1="331" y1="120" x2="331" y2="350" stroke="#3d0e10" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="326" y="115" text-anchor="end" class="mk" fill="#3d0e10">median $276</text>
  <line x1="405" y1="120" x2="405" y2="350" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="2 3"/>
  <text x="410" y="115" class="mk" fill="#3a3a3a">mean $395</text>

  <!-- x labels -->
  <g class="ax" text-anchor="middle">
    <text x="119" y="368">$0&#8211;100</text>
    <text x="215" y="368">100&#8211;200</text>
    <text x="311" y="368">200&#8211;300</text>
    <text x="407" y="368">300&#8211;500</text>
    <text x="503" y="368">500&#8211;1k</text>
    <text x="599" y="368">$1k+</text>
  </g>
  <text x="345" y="388" text-anchor="middle" class="axb">Per-capita allocation ($) &#183; number of cities</text>

  <text x="24" y="404" class="src">Source: Texas Comptroller; author's calculations. The mean exceeds the median &#8212; the mark of a right skew.</text>
</svg>

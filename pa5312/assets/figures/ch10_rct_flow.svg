<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Flow diagram of a randomized trial: an eligible population is randomly assigned to a treatment group that gets the program or a control group that does not; comparing their outcomes gives the causal effect.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .bt   { font: 700 13.5px "Helvetica Neue", Arial, sans-serif; }
    .bd   { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .edge { font: 600 12px "Helvetica Neue", Arial, sans-serif; fill: #501214; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
    .box  { fill: #ffffff; stroke: #cfc3c4; stroke-width: 1.3; }
    .boxm { fill: #f7f1f0; stroke: #501214; stroke-width: 1.5; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">RANDOMIZED TRIALS &#183; CASES C, D, E</text>
  <text x="24" y="72" class="head">How randomization identifies an effect</text>
  <text x="24" y="94" class="dek">Chance assignment makes the groups comparable, so the difference in outcomes is the effect</text>

  <defs>
    <marker id="a10" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a9a9a"/></marker>
  </defs>

  <!-- eligible pool -->
  <rect x="280" y="120" width="160" height="38" rx="4" class="box"/>
  <text x="360" y="144" text-anchor="middle" class="bt" fill="#1a1a1a">Eligible population</text>
  <line x1="360" y1="158" x2="360" y2="178" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a10)"/>

  <!-- randomize -->
  <rect x="298" y="180" width="124" height="34" rx="17" class="boxm"/>
  <text x="360" y="202" text-anchor="middle" class="bt" fill="#501214">Randomize</text>

  <!-- split -->
  <line x1="320" y1="214" x2="180" y2="252" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a10)"/>
  <line x1="400" y1="214" x2="540" y2="252" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a10)"/>

  <!-- treatment -->
  <rect x="40" y="256" width="250" height="52" rx="4" class="box"/>
  <text x="56" y="279" class="bt" fill="#1a1a1a">Treatment group</text>
  <text x="56" y="298" class="bd">gets the program</text>

  <!-- control -->
  <rect x="430" y="256" width="250" height="52" rx="4" class="box"/>
  <text x="446" y="279" class="bt" fill="#1a1a1a">Control group</text>
  <text x="446" y="298" class="bd">does not get the program</text>

  <!-- to compare -->
  <line x1="165" y1="308" x2="300" y2="336" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a10)"/>
  <line x1="555" y1="308" x2="420" y2="336" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a10)"/>

  <!-- compare -->
  <rect x="240" y="338" width="240" height="30" rx="4" class="boxm"/>
  <text x="360" y="358" text-anchor="middle" class="bt" fill="#501214">Compare outcomes = causal effect</text>

  <text x="24" y="374" class="src">Cases C (NSW), D (MTO), E (Perry).</text>
</svg>

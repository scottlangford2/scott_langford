<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-label="Bar chart: the National Supported Work program's estimated effect on 1978 earnings is a credible +$1,794 against the randomized control group, but −$8,498 against a naive survey comparison.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .val  { font: 700 19px "Helvetica Neue", Arial, sans-serif; }
    .grp  { font: 600 13px "Helvetica Neue", Arial, sans-serif; fill: #3a3a3a; }
    .sub  { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .ax   { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <!-- house-style header: maroon tab, kicker, serif headline, dek -->
  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">NATIONAL SUPPORTED WORK &#183; CASE C</text>
  <text x="24" y="72" class="head">The same program, two answers</text>
  <text x="24" y="94" class="dek">Estimated effect on 1978 earnings, by comparison group</text>

  <!-- zero baseline (emphasised), right-hand axis label -->
  <line x1="24" y1="190" x2="612" y2="190" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="620" y="194" class="ax">$0</text>

  <!-- positive bar: +1794 -->
  <rect x="175" y="137" width="150" height="53" fill="#501214"/>
  <text x="250" y="128" text-anchor="middle" class="val" fill="#501214">+$1,794</text>
  <text x="250" y="214" text-anchor="middle" class="grp">Experimental</text>
  <text x="250" y="232" text-anchor="middle" class="sub">vs. randomized controls &#183; credible</text>

  <!-- negative bar: -8498 -->
  <rect x="395" y="190" width="150" height="255" fill="#BEBEBE"/>
  <text x="470" y="470" text-anchor="middle" class="val" fill="#3a3a3a">&#8722;$8,498</text>
  <text x="470" y="167" text-anchor="middle" class="grp">Naive comparison</text>
  <text x="470" y="185" text-anchor="middle" class="sub">vs. a survey sample &#183; an artifact of selection</text>

  <text x="24" y="500" class="src">Source: LaLonde (1986); Dehejia &amp; Wahba (1999).</text>
</svg>

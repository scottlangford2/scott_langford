<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Line chart: net present value of the NSW cost-benefit model falls from about +$2,049 at a 2 percent discount rate to about −$624 at 12 percent, crossing zero near a 9 percent break-even rate.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .val  { font: 700 13px "Helvetica Neue", Arial, sans-serif; fill: #501214; }
    .ax   { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .axb  { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; fill: #4b4b4b; }
    .mk   { font: 600 12px "Helvetica Neue", Arial, sans-serif; fill: #501214; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">COST-BENEFIT ANALYSIS &#183; CASE C</text>
  <text x="24" y="72" class="head">Net present value falls as the discount rate rises</text>
  <text x="24" y="94" class="dek">NSW cost-benefit model, net present value by discount rate</text>

  <!-- horizontal gridlines only (Economist) -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="60" y1="137.5" x2="600" y2="137.5"/>
    <line x1="60" y1="225"   x2="600" y2="225"/>
    <line x1="60" y1="400"   x2="600" y2="400"/>
  </g>
  <!-- zero line emphasised -->
  <line x1="60" y1="312.5" x2="600" y2="312.5" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- right-hand axis labels -->
  <text x="612" y="141" class="ax">$2,000</text>
  <text x="612" y="229" class="ax">$1,000</text>
  <text x="612" y="316" class="ax">$0</text>
  <text x="612" y="404" class="ax">&#8722;$1,000</text>

  <!-- break-even marker (maroon dashed, ~9.3%) -->
  <line x1="439" y1="137.5" x2="439" y2="312.5" stroke="#501214" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="445" y="150" class="mk">break-even &#8776; 9%</text>

  <!-- NPV line -->
  <polyline points="123,133 253,216 383,287 557,367" fill="none" stroke="#501214" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#501214">
    <circle cx="123" cy="133" r="4.5"/>
    <circle cx="253" cy="216" r="4.5"/>
    <circle cx="383" cy="287" r="4.5"/>
    <circle cx="557" cy="367" r="4.5"/>
  </g>

  <text x="123" y="122" text-anchor="middle" class="val">+$2,049</text>
  <text x="253" y="205" text-anchor="middle" class="val">+$1,106</text>
  <text x="383" y="276" text-anchor="middle" class="val">+$293</text>
  <text x="557" y="387" text-anchor="middle" class="val" fill="#6b6b6b">&#8722;$624</text>

  <!-- x axis -->
  <text x="123" y="420" text-anchor="middle" class="ax">2%</text>
  <text x="253" y="420" text-anchor="middle" class="ax">5%</text>
  <text x="383" y="420" text-anchor="middle" class="ax">8%</text>
  <text x="557" y="420" text-anchor="middle" class="ax">12%</text>
  <text x="330" y="440" text-anchor="middle" class="axb">Discount rate</text>

  <text x="24" y="460" class="src">Illustrative; benefit is the NSW experimental estimate (+$1,794/year).</text>
</svg>

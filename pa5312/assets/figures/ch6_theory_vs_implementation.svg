<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Decision diagram: an outcome that did not move leads to the question, was the program delivered as designed? Yes means theory failure; no means implementation failure.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .bt   { font: 700 14px "Helvetica Neue", Arial, sans-serif; }
    .bd   { font: 400 12.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .edge { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; fill: #501214; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
    .box  { fill: #ffffff; stroke: #cfc3c4; stroke-width: 1.3; }
    .boxq { fill: #f7f1f0; stroke: #501214; stroke-width: 1.4; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">PROCESS EVALUATION &#183; CH 6</text>
  <text x="24" y="72" class="head">A null result has two explanations</text>
  <text x="24" y="94" class="dek">Outcome data alone cannot tell them apart &#8212; only process evidence can</text>

  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a9a9a"/></marker>
  </defs>

  <!-- top: outcome did not move -->
  <rect x="270" y="120" width="180" height="40" rx="4" class="box"/>
  <text x="360" y="145" text-anchor="middle" class="bt" fill="#1a1a1a">Outcome did not move</text>
  <line x1="360" y1="160" x2="360" y2="184" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a6)"/>

  <!-- question -->
  <rect x="236" y="188" width="248" height="46" rx="4" class="boxq"/>
  <text x="360" y="209" text-anchor="middle" class="bt" fill="#501214">Was it delivered as designed?</text>
  <text x="360" y="226" text-anchor="middle" class="bd">fidelity &#183; dosage &#183; reach</text>

  <!-- branches -->
  <line x1="290" y1="234" x2="180" y2="286" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a6)"/>
  <text x="214" y="258" class="edge">Yes</text>
  <line x1="430" y1="234" x2="540" y2="286" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a6)"/>
  <text x="486" y="258" text-anchor="end" class="edge">No</text>

  <!-- left: theory failure -->
  <rect x="40" y="290" width="270" height="62" rx="4" class="box"/>
  <text x="56" y="313" class="bt" fill="#1a1a1a">Theory failure</text>
  <text x="56" y="333" class="bd">The logic was wrong.</text>
  <text x="56" y="349" class="bd">Rethink or replace the program.</text>

  <!-- right: implementation failure -->
  <rect x="410" y="290" width="270" height="62" rx="4" class="box"/>
  <text x="426" y="313" class="bt" fill="#1a1a1a">Implementation failure</text>
  <text x="426" y="333" class="bd">Delivery broke down.</text>
  <text x="426" y="349" class="bd">Fix the rollout, not the design.</text>

  <text x="24" y="372" class="src">Source: Rossi, Lipsey &amp; Henry (2019).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A logic model shown left to right: inputs, activities, outputs, outcomes, impacts. Inputs, activities and outputs are what the program does; outcomes and impacts are the change it causes. Each arrow is an assumption.">
  <style>
    .kick { font: 600 11.5px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; fill: #501214; }
    .head { font: 700 20px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1a1a1a; }
    .dek  { font: 400 13.5px "Helvetica Neue", Arial, sans-serif; fill: #5b5b5b; }
    .stage{ font: 700 14px "Helvetica Neue", Arial, sans-serif; fill: #501214; }
    .ex   { font: 400 11.5px "Helvetica Neue", Arial, sans-serif; fill: #6b6b6b; }
    .brk  { font: 600 12.5px "Helvetica Neue", Arial, sans-serif; fill: #3a3a3a; }
    .note { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #7a7a7a; }
    .src  { font: 400 11px "Helvetica Neue", Arial, sans-serif; fill: #9a9a9a; }
    .box  { fill: #f7f1f0; stroke: #501214; stroke-width: 1.3; }
  </style>

  <rect x="24" y="14" width="34" height="5" fill="#501214"/>
  <text x="24" y="44" class="kick">PROGRAM THEORY &amp; LOGIC MODELS &#183; CASE D</text>
  <text x="24" y="72" class="head">A logic model reads left to right</text>
  <text x="24" y="94" class="dek">Each arrow is an assumption that can fail</text>

  <!-- boxes -->
  <g>
    <rect x="24"  y="118" width="124" height="58" rx="3" class="box"/>
    <rect x="171" y="118" width="124" height="58" rx="3" class="box"/>
    <rect x="318" y="118" width="124" height="58" rx="3" class="box"/>
    <rect x="465" y="118" width="124" height="58" rx="3" class="box"/>
    <rect x="612" y="118" width="124" height="58" rx="3" class="box"/>
  </g>
  <text x="86"  y="144" text-anchor="middle" class="stage">Inputs</text>
  <text x="233" y="144" text-anchor="middle" class="stage">Activities</text>
  <text x="380" y="144" text-anchor="middle" class="stage">Outputs</text>
  <text x="527" y="144" text-anchor="middle" class="stage">Outcomes</text>
  <text x="674" y="144" text-anchor="middle" class="stage">Impacts</text>
  <text x="86"  y="164" text-anchor="middle" class="ex">voucher funding</text>
  <text x="233" y="164" text-anchor="middle" class="ex">run the lottery</text>
  <text x="380" y="164" text-anchor="middle" class="ex">vouchers used</text>
  <text x="527" y="164" text-anchor="middle" class="ex">lower-poverty area</text>
  <text x="674" y="164" text-anchor="middle" class="ex">adult earnings</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <g stroke="#9a9a9a" stroke-width="2" marker-end="url(#ah)">
    <line x1="150" y1="147" x2="167" y2="147"/>
    <line x1="297" y1="147" x2="314" y2="147"/>
    <line x1="444" y1="147" x2="461" y2="147"/>
    <line x1="591" y1="147" x2="608" y2="147"/>
  </g>

  <!-- brackets -->
  <path d="M24,204 L24,212 L442,212 L442,204" fill="none" stroke="#9a9a9a" stroke-width="1.4"/>
  <text x="233" y="230" text-anchor="middle" class="brk">What the program <tspan font-style="italic">does</tspan></text>
  <path d="M465,204 L465,212 L736,212 L736,204" fill="none" stroke="#501214" stroke-width="1.6"/>
  <text x="600" y="230" text-anchor="middle" class="brk" fill="#501214">The change it <tspan font-style="italic">causes</tspan></text>

  <text x="380" y="258" text-anchor="middle" class="note">The distance between the two brackets is what an impact evaluation must bridge.</text>
  <text x="24" y="290" class="src">Illustrative: Moving to Opportunity (Case D).</text>
</svg>
